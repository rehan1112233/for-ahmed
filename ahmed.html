<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For Ahmed 💗</title>
<style>
  /* ---------- Base ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow-x: hidden;
    font-family: "Segoe UI", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
    color: #5a2a4a;
    background: linear-gradient(135deg, #ffd6ec 0%, #e7d7ff 50%, #fff0f7 100%);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  /* ---------- Floating background hearts ---------- */
  .bg-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg-hearts span {
    position: absolute;
    bottom: -50px;
    font-size: 22px;
    opacity: 0.75;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 4px rgba(255, 182, 210, 0.6));
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* ---------- Floating bows ---------- */
  .bg-bows {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg-bows span {
    position: absolute;
    font-size: 26px;
    animation: sway 6s ease-in-out infinite;
    opacity: 0.55;
  }
  @keyframes sway {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50%      { transform: translateY(-14px) rotate(8deg); }
  }

  /* ---------- Screens ---------- */
  .screen {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 520px;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 182, 210, 0.6);
    border-radius: 32px;
    padding: 36px 26px;
    text-align: center;
    box-shadow:
      0 10px 40px rgba(236, 130, 180, 0.35),
      0 0 0 6px rgba(255, 255, 255, 0.5) inset;
    animation: popIn 0.6s cubic-bezier(.2,1.4,.4,1) both;
  }
  .screen.hidden { display: none; }

  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.85) translateY(20px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ---------- Typography ---------- */
  .title {
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    font-weight: 800;
    background: linear-gradient(90deg, #ff5c9e, #b36bff, #ff5c9e);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 4s linear infinite;
    line-height: 1.25;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }
  @keyframes shimmer {
    0%   { background-position: 0% center; }
    100% { background-position: 200% center; }
  }

  .subtitle {
    font-size: clamp(1.1rem, 4.5vw, 1.5rem);
    color: #8a3a6a;
    margin-bottom: 18px;
    font-weight: 600;
  }

  .question {
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    font-weight: 800;
    color: #c2185b;
    margin: 22px 0 28px;
    text-shadow: 0 2px 8px rgba(255, 182, 210, 0.5);
  }

  /* ---------- Buttons ---------- */
  .btn-row {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
  }

  .btn {
    appearance: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    font-size: clamp(1rem, 4vw, 1.2rem);
    padding: 14px 26px;
    border-radius: 999px;
    width: 100%;
    max-width: 320px;
    color: white;
    letter-spacing: 0.5px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  }
  .btn:hover  { transform: translateY(-3px) scale(1.03); filter: brightness(1.08); }
  .btn:active { transform: translateY(0) scale(0.98); }

  .btn-yes {
    background: linear-gradient(135deg, #ff6fa8, #ff9ec7);
    box-shadow: 0 6px 20px rgba(255, 111, 168, 0.5);
  }
  .btn-no {
    background: linear-gradient(135deg, #b36bff, #d3a8ff);
    box-shadow: 0 6px 20px rgba(179, 107, 255, 0.45);
  }
  .btn-back {
    background: linear-gradient(135deg, #ffb6d5, #ffd1e8);
    color: #7a2a55;
    margin-top: 24px;
    max-width: 200px;
    font-size: 0.95rem;
  }

  /* ---------- Yes screen ---------- */
  .celebrate-emoji {
    font-size: clamp(3rem, 12vw, 5rem);
    display: inline-block;
    animation: bounce 1.2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50%      { transform: translateY(-18px) rotate(5deg); }
  }

  /* ---------- No screen ---------- */
  .devil-row {
    font-size: clamp(2.2rem, 10vw, 3.5rem);
    margin: 10px 0 16px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .devil-row span {
    display: inline-block;
    animation: wiggle 1.4s ease-in-out infinite;
  }
  .devil-row span:nth-child(2) { animation-delay: 0.2s; }
  .devil-row span:nth-child(3) { animation-delay: 0.4s; }
  .devil-row span:nth-child(4) { animation-delay: 0.6s; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-12deg) scale(1); }
    50%      { transform: rotate(12deg) scale(1.15); }
  }

  .no-text {
    font-size: clamp(1.1rem, 4.5vw, 1.45rem);
    font-weight: 800;
    color: #8e1a4a;
    line-height: 1.4;
  }

  /* ---------- Heart burst ---------- */
  .burst {
    position: fixed;
    pointer-events: none;
    font-size: 24px;
    z-index: 9999;
    animation: burstFly 1s ease-out forwards;
  }
  @keyframes burstFly {
    0%   { opacity: 1; transform: translate(0,0) scale(0.5); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.6) rotate(var(--rot)); }
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .bg-hearts, .bg-bows { display: none; }
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 420px) {
    .screen { padding: 28px 18px; border-radius: 26px; }
    .btn { padding: 12px 18px; }
  }
</style>
</head>
<body>

  <!-- Background floating hearts -->
  <div class="bg-hearts" id="bgHearts" aria-hidden="true"></div>

  <!-- Background swaying bows -->
  <div class="bg-bows" id="bgBows" aria-hidden="true"></div>

  <!-- SCREEN 1: Question -->
  <section class="screen" id="screen-question">
    <div class="celebrate-emoji">🎀💗🎀</div>
    <h1 class="title">AHMED MERI JAAN 💗</h1>
    <p class="subtitle">I LOVE YOU SO MUCHH 🥹</p>
    <p class="question">DO YOU LOVE ME?</p>
    <div class="btn-row">
      <button class="btn btn-yes" id="btnYes">YES I DOO 💖</button>
      <button class="btn btn-no"  id="btnNo">NO I DONT 🙄</button>
    </div>
  </section>

  <!-- SCREEN 2: YES -->
  <section class="screen hidden" id="screen-yes">
    <div class="celebrate-emoji">💗😭💕</div>
    <h1 class="title">YAYAY ME MORE 💗😭💕</h1>
    <p class="subtitle">You made me the happiest 🥹🎀✨</p>
    <button class="btn btn-back" id="backFromYes">GO BACK ↩</button>
  </section>

  <!-- SCREEN 3: NO -->
  <section class="screen hidden" id="screen-no">
    <div class="devil-row" aria-hidden="true">
      <span>😈</span><span>💗</span><span>😈</span><span>💗</span>
    </div>
    <h1 class="title">OHH REALLY? 😏</h1>
    <p class="no-text">
      ANYWAYS, I'M GONNA TOUCH YOU TONIGHT 😈💗<br/>
      <span style="font-size:0.9em; opacity:0.85;">(you can't escape me, Ahmed 🎀)</span>
    </p>
    <div class="devil-row" aria-hidden="true" style="margin-top:14px;">
      <span>👿</span><span>💕</span><span>🔥</span><span>💕</span>
    </div>
    <button class="btn btn-back" id="backFromNo">GO BACK ↩</button>
  </section>

<script>
  /* ---------- Populate background hearts ---------- */
  (function populateHearts() {
    const container = document.getElementById('bgHearts');
    const emojis = ['💗','💕','💖','🎀','💘','🩷'];
    const count = 18;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.fontSize = (14 + Math.random() * 22) + 'px';
      s.style.animationDuration = (7 + Math.random() * 9) + 's';
      s.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(s);
    }
  })();

  /* ---------- Populate background bows ---------- */
  (function populateBows() {
    const container = document.getElementById('bgBows');
    const emojis = ['🎀','🩰','✨','🌸'];
    const count = 10;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top  = Math.random() * 100 + 'vh';
      s.style.animationDelay = (Math.random() * 4) + 's';
      container.appendChild(s);
    }
  })();

  /* ---------- Screen switching ---------- */
  const screens = {
    question: document.getElementById('screen-question'),
    yes:      document.getElementById('screen-yes'),
    no:       document.getElementById('screen-no')
  };

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.add('hidden'));
    const target = screens[name];
    target.classList.remove('hidden');
    // retrigger pop-in animation
    target.style.animation = 'none';
    void target.offsetWidth;
    target.style.animation = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------- Heart burst on click ---------- */
  function burstAt(x, y, emojiSet) {
    const count = 14;
    for (let i = 0; i < count; i++) {
      const el = document.createElement('span');
      el.className = 'burst';
      el.textContent = emojiSet[Math.floor(Math.random() * emojiSet.length)];
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const dist  = 80 + Math.random() * 120;
      el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      el.style.fontSize = (18 + Math.random() * 18) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1100);
    }
  }

  function handleBtn(e, target, emojiSet) {
    const rect = e.currentTarget.getBoundingClientRect();
    const x = rect.left + rect.width / 2;
    const y = rect.top  + rect.height / 2;
    burstAt(x, y, emojiSet);
    setTimeout(() => showScreen(target), 350);
  }

  document.getElementById('btnYes').addEventListener('click', function(e) {
    handleBtn(e, 'yes', ['💖','💗','💕','🎀','✨','💘']);
  });
  document.getElementById('btnNo').addEventListener('click', function(e) {
    handleBtn(e, 'no', ['😈','💗','🔥','💕','👿','💘']);
  });

  document.getElementById('backFromYes').addEventListener('click', function(e) {
    burstAt(e.currentTarget.getBoundingClientRect().left + 100,
            e.currentTarget.getBoundingClientRect().top,
            ['💗','💕','🎀']);
    setTimeout(() => showScreen('question'), 250);
  });
  document.getElementById('backFromNo').addEventListener('click', function(e) {
    burstAt(e.currentTarget.getBoundingClientRect().left + 100,
            e.currentTarget.getBoundingClientRect().top,
            ['😈','💗','💕']);
    setTimeout(() => showScreen('question'), 250);
  });
</script>
</body>
</html>
